    disabled_models: [llama-3.1-8b-instant, llama-3.3-70b-versatile, qwen/qwen3-32b]
    planner_models_env: GROQ_PLANNER_MODELS
    planner_models: [openai/gpt-oss-120b, qwen/qwen3.6-27b, openai/gpt-oss-20b]
