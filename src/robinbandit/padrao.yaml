# Catalogo de fabrica do RobinBandit.
#
# Vai DENTRO do pacote: quem instala pelo pip precisa de um catalogo para
# `robinbandit serve` subir sem escrever YAML nenhum. Provedor sem chave no
# ambiente simplesmente nao e montado, entao a lista inteira e segura como
# padrao.
#
# Nao edite este arquivo para ajustar a sua maquina: escreva so o que muda
# em ~/.robinbandit/config.yaml, ou use `herda: padrao` no seu proprio YAML.
version: 1
agent_mode: universal

# Em que lingua o painel e a linha de comando respondem: `pt` ou `en`.
# Vazio (ou ausente) significa "descubra pelo sistema" — quem roda em portugues
# recebe portugues sem configurar nada.
#
# Isto e o PADRAO. A escolha feita no painel, ou por `robinbandit language pt`,
# fica em ~/.robinbandit/preferencias.json e vence o que estiver aqui, do mesmo jeito
# que acontece com tier, modelos e cadeia.
#
# O codigo e os comentarios continuam em portugues; isto vale para o que a
# ferramenta responde, nao para quem a mantem.
idioma: ""

# Segredos nunca são versionados. O YAML guarda somente referências.
# Precedência em runtime: cofre Robin > ambiente > Settings do agente.
secrets:
  vault_path_env: ROBINBANDIT_VAULT_PATH
  account_config_path_env: ROBINBANDIT_ACCOUNTS_PATH

# Contas declaradas de fabrica. Uma conta e uma chave com nome; varias contas
# do mesmo provedor sao o caso normal, e o rotador alterna entre elas quando uma
# bate a cota. Aqui mora so o NOME da variavel — o valor fica no ambiente ou no
# cofre de quem roda.
accounts:
  items:
    - id: openrouter-paga
      provider: openrouter
      key_env: API_KEY_ULTRA
      label: OpenRouter (crédito pago)
      paga: true
      models: [deepseek/deepseek-v4-flash, deepseek/deepseek-v4-pro]
  # Quem serve cada modo pesado. Sem isto os dois cairiam na conta gratuita, que
  # e exatamente o oposto do que "Dedicado" quer dizer.
  tiers:
    ultra: openrouter-paga
    ultra_max: openrouter-paga

routing:
  strategy: adaptive
  last_resort: fallback
  chain_order: [groq, gemini, claude_code, cerebras, openrouter, chatgpt_codex, mistral, cohere, sambanova, deepinfra, fireworks, huggingface, claude, ollama, fallback]
  # Custo influencia sem derrotar saúde/qualidade. Para uma barreira econômica
  # rígida, use `strategy: tier`.
  # Como reagir ao erro de um provedor. TABELA, nao algoritmo: a redacao da
  # mensagem muda quando o provedor quer, e o tempo certo de espera muda por
  # instalacao e por plano contratado. O bandit e a media de latencia ficam no
  # codigo, porque sao aprendidos.
  #
  # Lidas DE CIMA PARA BAIXO, a primeira que casar decide. A ordem e
  # significativa: credito vem antes de cota porque a mensagem de credito
  # esgotado as vezes tambem cita quota, e tratar dinheiro acabado como rate
  # limit faz o roteador insistir em quem nao vai voltar.
  erros:
    regras:
      - tipo: credit
        quando_texto: ["402", insufficient, payment required, billing,
                       out of credit, credits, exceeded your current quota,
                       not enough balance, spend limit]
      - tipo: rate_limit
        quando_texto: ["429", too many requests, rate limit, rate_limit,
                       quota, overloaded, capacity]
      - tipo: auth
        quando_texto: ["401", "403", invalid api key, unauthorized, permission]
      - tipo: network
        quando_texto: [timeout, timed out, connect, network]
    # Segundos fora do jogo por tipo de falha. `escala` avanca um degrau a cada
    # repeticao da mesma falha, e o ultimo degrau se mantem.
    cooldown_s:
      rate_limit:
        escala: [60, 120, 300]
      credit: 1800      # dinheiro acabou; so volta no ciclo de billing
      auth: 3600        # chave ruim nao melhora sozinha
      network: 30
      other: 45

  # Sonda de cota: uma requisicao minima, fora de um turno, so para saber se
  # um provedor em cooldown ja voltou. Custa cota para medir cota — por isso
  # vem DESLIGADA. Compensa em provedor de assinatura com janela longa (5h,
  # diaria), onde acertar o momento da volta vale mais que os tokens gastos.
  quota_ping:
    ativo: false
    intervalo_s: 300
    so_em_cooldown: true   # pingar quem esta saudavel nao descobre nada novo

  cost_penalties:
    none: 0.00
    local: 0.00
    free_preferred: 0.00
    free_limited: 0.02
    mixed: 0.04
    credits: 0.07
    paid: 0.10
    subscription: 0.12
  weights:
    "classify:SIMPLE": [0.15, 0.55, 0.30]
    "analysis:CRITICAL": [0.60, 0.15, 0.25]
    "artifact:CRITICAL": [0.60, 0.15, 0.25]
    "coding:CRITICAL": [0.60, 0.15, 0.25]
    SIMPLE: [0.20, 0.50, 0.30]
    STANDARD: [0.40, 0.30, 0.30]
    COMPLEX: [0.60, 0.15, 0.25]
    CRITICAL: [0.60, 0.15, 0.25]

profiles:
  classify: [groq:openai/gpt-oss-20b, gemini:gemini-2.5-flash-lite]
  chat: [groq:openai/gpt-oss-20b, gemini:gemini-2.5-flash-lite]
  analysis: [groq:openai/gpt-oss-120b, chatgpt_codex:gpt-5.6-terra, groq:qwen/qwen3.6-27b, gemini:gemini-3.5-flash]
  artifact: [gemini:gemini-2.5-flash, chatgpt_codex:gpt-5.6-terra, groq:openai/gpt-oss-120b]
  coding: [chatgpt_codex:gpt-5.6-sol, gemini:antigravity-preview-05-2026, openrouter:openrouter/free, groq:openai/gpt-oss-120b, deepinfra:deepseek-ai/DeepSeek-V3]
  fallback: [groq:openai/gpt-oss-20b, gemini:gemini-2.5-flash-lite]

