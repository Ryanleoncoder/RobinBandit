[project]
name = "robinbandit"
version = "0.5.0"
description = "Roteador adaptativo de provedores de LLM baseado em Thompson sampling"
requires-python = ">=3.9"
authors = [{ name = "Ryanleoncoder", email = "ogawaleonelgon@gmail.com" }]
dependencies = []

[project.scripts]
robinbandit = "robinbandit.__main__:main"

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
yaml = ["PyYAML>=6,<7"]
providers = ["httpx>=0.27,<1"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "fastapi>=0.110", "httpx"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["robinbandit*"]

# O catalogo de provedores, a arte deles e a pagina do painel vao DENTRO do
# pacote. Fora dele, quem instala pelo pip fica sem catalogo para subir e com o
# painel quebrado. Um esquecimento aqui nao aparece em `pytest`: a suite roda
# com `pythonpath = ["src"]`, lendo o codigo-fonte, onde os arquivos sempre
# existem. Quem protege isto e o job `pacote` do CI.
[tool.setuptools.package-data]
robinbandit = ["padrao.yaml", "assets/providers/*", "assets/painel/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
